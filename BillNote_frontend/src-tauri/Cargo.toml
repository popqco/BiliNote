[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# tauri-build / tauri crate 与 @tauri-apps/api 大版本必须对齐（CLI 在 build 前会校验）。
# @tauri-apps/api 已升 2.10（commit bb9a70e），这里同步到 2.x 最新让 cargo 解析到匹配版本。
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-notification = "2.4.0"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# 仅 Windows：Start Menu 快捷方式写入 AUMID 属性（IShellLinkW + IPropertyStore
# + IPersistFile），让系统通知中心认得免安装 exe 的 Toast 署名。
# 版本对齐 Cargo.lock 已有的 windows 0.62.x，只加 feature 不引入新版本。
# webview2-com：挂 WebView2 ProcessFailed 事件做渲染进程崩溃自愈（OOM 白屏），
# 版本必须与依赖树里的 webview2-com 完全一致（0.39.x，COM 类型才互通）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_SystemInformation",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
] }
webview2-com = "0.39"

[package.metadata.tauri.bundle.macOS]
frameworks = ["bin/BiliNoteBackend/_internal/"]


